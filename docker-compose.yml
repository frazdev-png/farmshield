services:
  postgres:
    image: postgres:16-alpine
    container_name: farmshield_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmshield_db}
      POSTGRES_USER: ${POSTGRES_USER:-farmshield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmshield_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmshield_user} -d ${POSTGRES_DB:-farmshield_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: farmshield_postgres_data

